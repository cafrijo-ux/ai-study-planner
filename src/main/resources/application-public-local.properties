spring.config.import=optional:file:./.local/auth.properties
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-public.sql
planner.auth.cookie-secure=false
planner.public.ai-enabled=${PLANNER_AI_ENABLED:false}
gemini.api.key=${GEMINI_API_KEY:none}
llm.api.key=${OPENAI_API_KEY:none}
gpt.weekly.api-key=${OPENAI_API_KEY:none}
study.question.gpt.api-key=${OPENAI_API_KEY:none}
llm.demo-mode=${PLANNER_AI_DEMO_MODE:true}
gpt.weekly.enabled=${PLANNER_GPT_ENABLED:false}
study.question.gemini.enabled=${PLANNER_GEMINI_QUESTION_ENABLED:false}
study.question.gpt.enabled=${PLANNER_GPT_QUESTION_ENABLED:false}
