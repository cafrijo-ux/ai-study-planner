spring.application.name=ai-study-planner
spring.profiles.default=public-local
server.address=127.0.0.1
server.port=8083
spring.datasource.url=jdbc:h2:file:./.local/data/planner-public;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
gemini.api.key=none
llm.api.key=none
gpt.weekly.api-key=none
study.question.gpt.api-key=none
llm.provider=gemini
llm.demo-mode=true
gpt.weekly.enabled=false
study.question.gemini.enabled=false
study.question.gpt.enabled=false
planner.ai-cost.enabled=false
planner.study-log.idempotency.enabled=false
