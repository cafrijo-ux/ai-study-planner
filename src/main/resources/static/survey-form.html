<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="/auth-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학습 목표 설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 650px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h2 {
            margin-top: 30px;
            color: #2563eb;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background-color: #eef2ff;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        .link-area {
            margin-top: 20px;
            text-align: center;
        }

        .link-area a {
            color: #2563eb;
            text-decoration: none;
            margin: 0 8px;
        }
        @media (max-width: 760px) {
            body { padding: 12px; }
            .container { width: 100%; padding: 18px; box-sizing: border-box; }
        }
    </style>
    <link rel="stylesheet" href="/ui-polish.css">
</head>
<body>

<div class="container">
    <h1>AI 공부플래너 학습 목표 설정</h1>

    <div id="goalFields">
    <h2>1. 목표 정보</h2>

    <label>목표명</label>
    <input type="text" id="goalName" placeholder="예: 정보처리기사 필기 합격">

    <label>목표 유형</label>
    <select id="goalType">
        <option value="자격증 준비">자격증 준비</option>
        <option value="시험 대비">시험 대비</option>
        <option value="과목 성적 향상">과목 성적 향상</option>
        <option value="프로젝트 준비">프로젝트 준비</option>
    </select>

    <label>시험일 / 목표 마감일</label>
    <input type="date" id="examDate">

    <label>목표 점수</label>
    <input type="text" id="targetScore" placeholder="예: 80점 이상">

    <label>현재 수준</label>
    <select id="currentLevel">
        <option value="기초 부족">기초 부족</option>
        <option value="보통">보통</option>
        <option value="자신 있음">자신 있음</option>
    </select>

    <label>현재 가장 약한 부분</label>
    <input type="text" id="weakPoint" placeholder="예: 문제 적용, 암기, 개념 이해">

    <label>하루 공부 가능 시간(분)</label>
    <input type="number" id="dailyStudyTime" placeholder="예: 120">

    <label>선호 공부 방식</label>
    <select id="preferredStudyMethod">
        <option value="개념 학습">개념 학습</option>
        <option value="문제풀이">문제풀이</option>
        <option value="오답정리">오답정리</option>
        <option value="복습">복습</option>
        <option value="암기">암기</option>
    </select>

    </div>
    <p id="registrationNotice" role="status"></p>
    <h2>2. 과목 정보</h2>

    <label>과목명</label>
    <input type="text" id="subjectName" placeholder="예: 운영체제">

    <label>과목별 난이도</label>
    <select id="difficulty">
        <option value="쉬움">쉬움</option>
        <option value="보통">보통</option>
        <option value="어려움">어려움</option>
    </select>

    <label>과목별 중요도</label>
    <select id="priorityLevel">
        <option value="높음">높음</option>
        <option value="보통">보통</option>
        <option value="낮음">낮음</option>
    </select>

    <label>과목별 현재 자신감</label>
    <select id="currentConfidence">
        <option value="자신 없음">자신 없음</option>
        <option value="보통">보통</option>
        <option value="자신 있음">자신 있음</option>
    </select>

    <button id="saveSurveyButton" onclick="saveSurvey()">학습 목표 저장</button>

    <div class="result" id="result">저장 결과가 여기에 표시됩니다.</div>

    <div class="link-area">
        <a href="/goals">목표 목록 보기</a>
        <a href="/subjects">과목 목록 보기</a>
        <a href="/study-log-form.html">공부 기록 입력</a>
        <a href="/dashboard.html">대시보드</a>
    </div>
</div>

<script src="/goal-context.js"></script>
<script>
    const addSubjectMode = new URLSearchParams(location.search).get('mode') === 'add-subject';
    let registrationBusy = false;
    let completionReady = !addSubjectMode;
    const value = id => document.getElementById(id).value.trim();

    async function prepareRegistration() {
        GoalContext.links();
        if (!addSubjectMode) return;
        document.getElementById('goalFields').hidden = true;
        document.getElementById('saveSurveyButton').disabled = true;
        try {
            if (!GoalContext.validId(GoalContext.id)) throw new Error('과목을 추가할 목표 번호를 확인하세요.');
            const goals = await GoalContext.readResponse(await fetch('/goals', {cache:'no-store'}));
            const goal = Array.isArray(goals) && goals.find(g => g.userId === 1 && String(g.goalId) === GoalContext.id);
            if (!goal) throw new Error('선택한 목표를 찾을 수 없습니다. 대시보드에서 목표를 다시 선택하세요.');
            document.getElementById('registrationNotice').textContent = goal.goalId + '번 · ' + goal.goalName + '에 과목을 추가합니다. 목표 정보와 기존 계획은 유지됩니다.';
            document.getElementById('saveSurveyButton').textContent = '선택한 목표에 과목 저장';
            completionReady = true;
            document.getElementById('saveSurveyButton').disabled = false;
        } catch (error) {
            document.getElementById('result').textContent = error instanceof TypeError ? '서버에 연결하지 못했습니다. 입력은 유지됩니다.' : error.message;
        }
    }

    async function saveSurvey() {
        if (registrationBusy || !completionReady) return;
        const result = document.getElementById('result');
        const button = document.getElementById('saveSurveyButton');
        const subject = {userId:1, subjectName:value('subjectName'), difficulty:value('difficulty'),
            priorityLevel:value('priorityLevel'), currentConfidence:value('currentConfidence')};
        const goal = {userId:1, goalName:value('goalName'), goalType:value('goalType'),
            examDate:value('examDate'), targetScore:value('targetScore'), currentLevel:value('currentLevel'),
            weakPoint:value('weakPoint'), dailyStudyTime:Number(value('dailyStudyTime')), preferredStudyMethod:value('preferredStudyMethod')};
        if (!subject.subjectName) { result.textContent = '과목명을 입력해야 합니다.'; return; }
        if (!addSubjectMode && (!goal.goalName || !goal.examDate || !goal.targetScore || !goal.weakPoint ||
            !Number.isInteger(goal.dailyStudyTime) || goal.dailyStudyTime < 1 || goal.dailyStudyTime > 1440)) {
            result.textContent = '목표명, 마감일, 목표 점수, 취약 부분과 하루 공부 시간(1~1440분)을 확인하세요.'; return;
        }
        registrationBusy = true; button.disabled = true;
        result.textContent = '저장 중입니다. 잠시 기다려 주세요.';
        try {
            const path = addSubjectMode ? '/goals/' + GoalContext.id + '/subjects' : '/goal-registrations';
            const data = await GoalContext.readResponse(await fetch(path, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify(addSubjectMode ? subject : {goal,subject})
            }));
            if (data?.saved !== true || !Number.isSafeInteger(data.goal?.goalId) || data.goal.goalId <= 0 ||
                !Number.isSafeInteger(data.subject?.subjectId) || data.subject.subjectId <= 0 ||
                data.subject.goalId !== data.goal.goalId ||
                (addSubjectMode && String(data.goal.goalId) !== GoalContext.id) ||
                typeof data.goal.goalName !== 'string' || typeof data.subject.subjectName !== 'string') {
                throw new Error('저장 결과 형식을 확인할 수 없습니다. 입력을 유지합니다. 같은 내용으로 다시 시도하면 중복 등록을 확인합니다.');
            }
            GoalContext.select(data.goal.goalId);
            result.textContent = (data.duplicate ? '동일한 등록이 이미 완료되어 기존 정보를 확인했습니다.' : '학습 목표와 과목 정보가 저장되었습니다.') +
                '\n목표: ' + data.goal.goalName + ' (' + data.goal.goalId + '번)\n과목: ' + data.subject.subjectName;
            const link = document.createElement('a');
            link.href = '/dashboard.html?goalId=' + data.goal.goalId;
            link.textContent = ' 이 목표로 대시보드 열기';
            result.appendChild(link);
            document.querySelectorAll('a[href]').forEach(a => {
                const url = new URL(a.href, location.href);
                if (['/dashboard.html','/study-log-form.html'].includes(url.pathname)) {
                    url.searchParams.set('goalId', data.goal.goalId); a.href = url.pathname + url.search;
                }
            });
        } catch (error) {
            result.textContent = error instanceof TypeError ?
                '서버 연결 또는 응답 수신에 실패했습니다. 입력은 유지됩니다. 같은 내용으로 다시 시도하면 기존 등록을 확인합니다.' : error.message;
        } finally {
            registrationBusy = false; button.disabled = false;
        }
    }
    prepareRegistration();
</script>

</body>
</html>
